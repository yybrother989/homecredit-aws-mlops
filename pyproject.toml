[project]
name = "homecredit"
version = "0.1.0"
description = "Home Credit credit-risk MLOps project on AWS"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core ML
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=0.20.0",
    # AWS
    "boto3>=1.34.0",
    "sagemaker>=2.210.0,<3.0",  # v3 dropped sagemaker.feature_store; pin to v2
    "awscli>=1.32.0",
    # IaC
    "aws-cdk-lib>=2.130.0",
    "constructs>=10.3.0",
    # Experiment tracking
    "mlflow>=2.11.0",
    # Kaggle
    "kaggle>=1.6.0",
    # Athena (Phase 2: query Feature Store offline)
    "pyathena>=3.0.0",
    # Glue catalog + S3 helpers (Phase 2: register external Athena table)
    "awswrangler>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "diagrams>=0.24.0",  # hero architecture diagram (AWS-icon renders)
]

[tool.uv]
# uv will create .venv/ automatically; lockfile is uv.lock

[tool.ruff]
line-length = 100
target-version = "py311"
# CDK synth output and bundled CDK Lambda assets are generated; don't lint them.
extend-exclude = ["infra/cdk.out/**", "data/**", ".venv/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
