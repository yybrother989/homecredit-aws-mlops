name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src infra tests

      - name: Tests
        run: uv run pytest -q

  cdk-synth:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk
      - run: uv sync
      - name: cdk synth (no deploy)
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-west-2
        run: uv run cdk synth --quiet
